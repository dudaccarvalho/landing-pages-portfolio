<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfólio de landing pages de Duda Carvalho.">
  <title>Duda Carvalho | Portfólio de landing pages</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #30213b; background: #faf6fb; font: 1rem/1.6 system-ui, sans-serif; }
    .wrap { width: min(68rem, calc(100% - 2.5rem)); margin: auto; }
    header, footer { padding-block: 1.5rem; }
    header { display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #e8deeb; }
    a { color: #66377c; text-underline-offset: .23em; }
    a:focus-visible { outline: 2px solid #66377c; outline-offset: 4px; }
    .intro { padding-block: clamp(3rem, 10vw, 7rem) 3rem; }
    h1, h2, h3 { font-family: Georgia, serif; font-weight: normal; line-height: 1.05; margin: 0; }
    h1 { max-width: 13ch; font-size: clamp(3rem, 9vw, 6.5rem); letter-spacing: -.055em; }
    h2 { font-size: 2rem; margin-bottom: 1.25rem; }
    h3 { font-size: clamp(2.3rem, 5vw, 3.5rem); }
    .projects { display: grid; gap: 1.5rem; }
    article { display: grid; grid-template-columns: 1.2fr 1fr; background: #f0e6f3; border-radius: 1.25rem; overflow: hidden; }
    .preview { width: 100%; height: 100%; min-height: 17rem; object-fit: cover; display: block; }
    .details { align-self: center; padding: clamp(1.5rem, 5vw, 3.5rem); }
    .button { display: inline-block; padding: .65rem 1rem; border-radius: .5rem; background: #66377c; color: white; font-weight: 600; text-decoration: none; }
    .button:hover { background: #4c285e; }
    .button:focus-visible { outline-offset: 3px; }
    footer { margin-top: 3rem; border-top: 1px solid #e8deeb; }
    @media (max-width: 650px) {
      article { grid-template-columns: 1fr; }
      .preview { height: auto; min-height: 0; aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <strong>Duda Carvalho</strong>
    <a href="#projetos">Projetos</a>
  </header>
  <main class="wrap">
    <section class="intro">
      <h1>Portfólio de landing pages</h1>
      <p>Projetos de design e desenvolvimento web por Duda Carvalho.</p>
    </section>
    <section id="projetos" aria-labelledby="titulo-projetos">
      <h2 id="titulo-projetos">Projetos</h2>
      <div class="projects">
        <article>
          <img class="preview" src="flora-studio/images/sala.webp" width="768" height="512" alt="Costela-de-adão em uma sala iluminada pelo sol">
          <div class="details">
            <h3>Flora Studio</h3>
            <p>Landing page para uma marca fictícia de plantas para apartamento. Feita com HTML e CSS.</p>
            <a class="button" href="flora-studio/index.html">Ver a Flora Studio <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <footer class="wrap">Duda Carvalho</footer>
</body>
</html>
